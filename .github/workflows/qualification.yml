name: Docker qualification

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: qualification-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  deterministic:
    name: Tree and 100-agent mock scale
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: "@arduano"
      - name: Install exact npm and verify toolchain
        shell: bash
        run: |
          expected_node="$(<.node-version)"
          expected_npm="$(jq -r '.packageManager | ltrimstr("npm@")' package.json)"
          npm install --global --ignore-scripts "npm@$expected_npm"
          test "$(node --version)" = "v$expected_node"
          test "$(npm --version)" = "$expected_npm"
      - name: Install qualification prerequisites
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ripgrep
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$chrome"
          echo "AGENT_MULTIPLEX_CHROME_EXECUTABLE=$chrome" >> "$GITHUB_ENV"
          echo "AGENT_MULTIPLEX_PLAYWRIGHT_MODULE=playwright-core" >> "$GITHUB_ENV"
      - name: Install locked dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}
        run: npm ci --strict-allow-scripts
      - name: Detect staged transport boundary
        id: transport
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, existsSync, readFileSync } from 'node:fs';
          const path = 'transport-candidate/manifest.json';
          const manifest = existsSync(path) ? JSON.parse(readFileSync(path, 'utf8')) : null;
          if (manifest && (!/^[0-9a-f]{40}$/.test(manifest.upstreamCommit) ||
              typeof manifest.releaseBlocked !== 'boolean')) throw new Error('Invalid transport candidate boundary');
          appendFileSync(process.env.GITHUB_OUTPUT,
            `candidate=${manifest !== null}\nrelease_blocked=${manifest?.releaseBlocked === true}\n` +
            `upstream_commit=${manifest?.upstreamCommit ?? ''}\n`);
          NODE
      - name: Check out exact independent transport source
        if: steps.transport.outputs.candidate == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: arduano/p2prpc
          ref: ${{ steps.transport.outputs.upstream_commit }}
          path: receipts/upstream-p2prpc
          # Private source requires this read-only cross-repository token.
          token: ${{ secrets.P2PRPC_SOURCE_READ_TOKEN || github.token }}
          persist-credentials: false
      - name: Prepare reviewed transport candidate without changing pins
        if: steps.transport.outputs.candidate == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}
        run: npm run prepare:transport-renewal -- receipts/upstream-p2prpc
      - name: Build qualification source
        run: npm run build
      - name: Create ephemeral Docker npm configuration
        id: npmrc
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}
        run: |
          path="$RUNNER_TEMP/agent-multiplex-docker.npmrc"
          umask 077
          printf '%s\n' \
            '@arduano:registry=https://npm.pkg.github.com' \
            "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" \
            'strict-allow-scripts=true' > "$path"
          echo "path=$path" >> "$GITHUB_OUTPUT"
      - name: Run control-tree qualification
        env:
          AGENT_MULTIPLEX_DOCKER_NPMRC: ${{ steps.npmrc.outputs.path }}
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}
        run: npm run test:docker:v4:tree
      - name: Run 10-host / 100-agent qualification
        env:
          AGENT_MULTIPLEX_DOCKER_NPMRC: ${{ steps.npmrc.outputs.path }}
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}
        run: npm run test:docker:v4:mock:scale
      - name: Upload sanitized qualification receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qualification-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            receipts/protocol-v4-control-tree/
            receipts/protocol-v4-mock-docker-scale/
          if-no-files-found: error
          retention-days: 30
