name: Temporary Leo private Windows qualification

on:
  push:
    branches:
      - temp/leo-windows-rerun-20260928

permissions:
  contents: read

jobs:
  installer:
    if: false
    runs-on: windows-2025
    timeout-minutes: 180
    steps:
      - name: Check out exact private Leo source
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: arduano/leo-multiplex
          ref: 3a5ca7d79197a99e433d8e072125593c2fd7dfd8
          ssh-key: ${{ secrets.TEMP_LEO_WINDOWS_READ_KEY }}
          persist-credentials: false
      - name: Verify source identity
        shell: pwsh
        run: |
          if ((git rev-parse HEAD).Trim() -ne '3a5ca7d79197a99e433d8e072125593c2fd7dfd8') { throw 'Wrong Leo source commit' }
          if (git status --porcelain) { throw 'Leo checkout is dirty' }
      - name: Set up exact Node without shared cache
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Qualify installer and distribution guards
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Invoke-Stage([string]$Name, [scriptblock]$Action) {
            $log = Join-Path $env:RUNNER_TEMP ("leo-" + $Name + ".log")
            & $Action *> $log
            $code = $LASTEXITCODE
            if ($code -ne 0) { Write-Host "$Name failed with exit $code"; exit $code }
            Write-Host "$Name passed"
          }
          Invoke-Stage 'npm-ci' { npm.cmd exec --yes --package=npm@11.17.0 -- npm ci --strict-allow-scripts }
          Invoke-Stage 'typecheck' { npm.cmd run typecheck }
          Invoke-Stage 'build' { npm.cmd run build }
          Invoke-Stage 'native-load' { node --input-type=module -e "await import('./scripts/install-copilot-host.mjs'); await import('./scripts/qualify-published-windows.mjs')" }
          Invoke-Stage 'prepare-temp' { node scripts/prepare-windows-ci-temp.mjs }
          Invoke-Stage 'graph-addon' { node scripts/check-local-fork-graph.mjs }
          Invoke-Stage 'work-command' { node tests/windows-work-command-smoke.mjs }
          Invoke-Stage 'work-shell' { node tests/windows-work-shell-smoke.mjs }
          Invoke-Stage 'stock-node-task' { node tests/windows-fresh-task-smoke.mjs }
          Invoke-Stage 'installer-suite' { npm.cmd run test:install }
          Invoke-Stage 'distribution-guards' { node --test tests/private-publication.test.mjs tests/private-provisioning.test.mjs }
      - name: Remove disposable Windows TEMP
        if: always() && steps.checkout.outcome == 'success'
        shell: pwsh
        run: |
          node scripts/prepare-windows-ci-temp.mjs cleanup *> (Join-Path $env:RUNNER_TEMP 'leo-cleanup.log')
          if ($LASTEXITCODE -ne 0) { throw 'Disposable TEMP cleanup failed' }

  behavior:
    if: false
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - name: Prepare encrypted failure diagnostics
        shell: pwsh
        run: |
          $script = @'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { createCipheriv, publicEncrypt, randomBytes, constants } from 'node:crypto';
          import { gzipSync } from 'node:zlib';
          const [input, output] = process.argv.slice(2);
          if (!input || !output) throw new Error('Expected input and output paths');
          const publicKey = `-----BEGIN PUBLIC KEY-----
          MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEArtDpNGEq5IVxZe4exo+n
          IEicEFD+R0hyIkchuyKjjLJ1VTQH+dLhuwJkjMFd84twdgfMlwNQYe3PRCwkOS9A
          dWilfjPK9NeqtB4mr0HQhbWhOciVI7Bjj8bxMkSLljZo3oiYricBuu0pKCH6NWta
          J0UTyIugUDP603+kT2OovOUX7aDd27ZW0EWO0A4NmlAHwcGesvWWFCHrQsBwzlnk
          k3kScrxxpdhvKTlkN2S34WeH/qbr2asninNuylbQ8hC+nXJ0CrHz4vr0DFFMIVKy
          rqoqtmt1KxzqR71yoSeAhrJFPBe4CX4tgHuNfn2fJQ7jshTSqakZrjYk3c+57Cx2
          sAtooEUPGxEQOBFVfAMWAqYTvuyVbUhtQ4WA3ZEuvyRnX8mAAY/uNBHe37U5nQx6
          Udm1COt3/Et8/nBm5GHX8hI2XCUSHBcOOcz7RnkbDzlmzzuruPk4RRhJwkrUyHgW
          6k2I2R3l1w+Ao8DwjQ53c6WLIFHUPRjRKifeVZuC/2Z5AgMBAAE=
          -----END PUBLIC KEY-----`;
          const key = randomBytes(32), iv = randomBytes(12);
          const cipher = createCipheriv('aes-256-gcm', key, iv);
          const ciphertext = Buffer.concat([cipher.update(gzipSync(readFileSync(input))), cipher.final()]);
          const encryptedKey = publicEncrypt({ key: publicKey, padding: constants.RSA_PKCS1_OAEP_PADDING, oaepHash: 'sha256' }, key);
          writeFileSync(output, JSON.stringify({ version: 1, encryptedKey: encryptedKey.toString('base64'), iv: iv.toString('base64'), tag: cipher.getAuthTag().toString('base64'), ciphertext: ciphertext.toString('base64') }), { mode: 0o600 });
          '@
          Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'encrypt-leo-failure.mjs') -Value $script -Encoding utf8
      - name: Check out exact private Leo source
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: arduano/leo-multiplex
          ref: 6465fad4efbda499ce1ba0bd846453ba63a94b22
          fetch-depth: 5
          ssh-key: ${{ secrets.TEMP_LEO_WINDOWS_READ_KEY }}
          persist-credentials: false
      - name: Verify source identity
        shell: pwsh
        run: |
          if ((git rev-parse HEAD).Trim() -ne '6465fad4efbda499ce1ba0bd846453ba63a94b22') { throw 'Wrong Leo helper commit' }
          if (git status --porcelain) { throw 'Leo checkout is dirty' }
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path scripts/bootstrap-windows-v6.ps1), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors) { $errors | Format-List; throw 'Bootstrap PowerShell parse failed' }
      - name: Set up exact Node without shared cache
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install and build exact published Leo source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Invoke-Stage([string]$Name, [scriptblock]$Action) {
            $log = Join-Path $env:RUNNER_TEMP ("leo-behavior-" + $Name + ".log")
            & $Action *> $log
            $code = $LASTEXITCODE
            if ($code -ne 0) {
              node (Join-Path $env:RUNNER_TEMP 'encrypt-leo-failure.mjs') $log (Join-Path $env:RUNNER_TEMP 'leo-full-test.enc.json')
              throw "$Name failed with exit $code"
            }
            Write-Host "$Name passed"
          }
          Invoke-Stage 'npm-ci' { npm.cmd exec --yes --package=npm@11.17.0 -- npm ci --strict-allow-scripts }
          Invoke-Stage 'typecheck' { npm.cmd run typecheck }
          Invoke-Stage 'build' { npm.cmd run build }
      - name: Prepare protected disposable Windows TEMP
        shell: pwsh
        run: |
          node scripts/prepare-windows-ci-temp.mjs *> (Join-Path $env:RUNNER_TEMP 'leo-final-temp.log')
          if ($LASTEXITCODE -ne 0) { throw 'Protected disposable TEMP preparation failed' }
      - name: Build exact production source under protected Windows ancestry
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Invoke-Stage([string]$Name, [scriptblock]$Action) {
            $log = Join-Path $env:RUNNER_TEMP ("leo-protected-" + $Name + ".log")
            & $Action *> $log
            $code = $LASTEXITCODE
            if ($code -ne 0) {
              node (Join-Path $env:RUNNER_TEMP 'encrypt-leo-failure.mjs') $log (Join-Path $env:RUNNER_TEMP 'leo-full-test.enc.json')
              throw "$Name failed with exit $code"
            }
            Write-Host "$Name passed"
          }
          $source = Join-Path $env:LEO_WINDOWS_TEST_TEMP_ROOT 'source'
          Invoke-Stage 'clone' { git clone --no-hardlinks $env:GITHUB_WORKSPACE $source }
          Invoke-Stage 'checkout' { git -C $source checkout --detach 3a5ca7d79197a99e433d8e072125593c2fd7dfd8 }
          Set-Location -LiteralPath $source
          Invoke-Stage 'npm-ci' { npm.cmd exec --yes --package=npm@11.17.0 -- npm ci --strict-allow-scripts }
          Invoke-Stage 'build' { npm.cmd run build }
          Invoke-Stage 'production-ci' { npm.cmd exec --yes --package=npm@11.17.0 -- npm ci --omit=dev --strict-allow-scripts }
          Invoke-Stage 'graph' { node scripts/check-published-graph.mjs }
      - name: Qualify final native graph and root payload
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location -LiteralPath (Join-Path $env:LEO_WINDOWS_TEST_TEMP_ROOT 'source')
          function Invoke-Stage([string]$Name, [scriptblock]$Action) {
            $log = Join-Path $env:RUNNER_TEMP ("leo-final-" + $Name + ".log")
            & $Action *> $log
            $code = $LASTEXITCODE
            if ($code -ne 0) {
              node (Join-Path $env:RUNNER_TEMP 'encrypt-leo-failure.mjs') $log (Join-Path $env:RUNNER_TEMP 'leo-full-test.enc.json')
              throw "$Name failed with exit $code"
            }
            Write-Host "$Name passed"
          }
          Invoke-Stage 'published-graph' { node scripts/check-published-graph.mjs }
          Invoke-Stage 'native-load' { node --input-type=module -e "await import('@momics/iroh-http-node'); await import('@arduano/p2prpc-core')" }
          Invoke-Stage 'work-command' { node tests/windows-work-command-smoke.mjs }
          Invoke-Stage 'work-shell' { node tests/windows-work-shell-smoke.mjs }
          Invoke-Stage 'stock-node-task' { node tests/windows-fresh-task-smoke.mjs }
          $release = Join-Path $env:LEO_WINDOWS_TEST_TEMP_ROOT 'release'
          Invoke-Stage 'private-release' { node --input-type=module -e "import { privateDirectory } from './dist/apps/host/src/private-state.js'; await privateDirectory(process.argv[1])" $release }
          Invoke-Stage 'stage-root' { node scripts/stage-fresh-payload.mjs --payload (Join-Path $release 'payload') }
          $nodeExe = (Get-Command node.exe).Source
          Invoke-Stage 'seal-root' { node scripts/fresh-install.mjs seal --artifact (Join-Path $release 'payload') --revision 3a5ca7d79197a99e433d8e072125593c2fd7dfd8 --roles root --node $nodeExe }
      - name: Upload encrypted failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: leo-v6-final-native-encrypted-${{ github.run_id }}
          path: ${{ runner.temp }}/leo-full-test.enc.json
          if-no-files-found: ignore
          retention-days: 1
      - name: Remove disposable Windows TEMP
        if: always() && steps.checkout.outcome == 'success'
        shell: pwsh
        run: |
          node scripts/prepare-windows-ci-temp.mjs cleanup *> (Join-Path $env:RUNNER_TEMP 'leo-behavior-cleanup.log')
          if ($LASTEXITCODE -ne 0) { throw 'Disposable TEMP cleanup failed' }

  bootstrap:
    if: false
    runs-on: windows-2025
    timeout-minutes: 180
    steps:
      - name: Check out exact integrated private candidate
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: arduano/leo-multiplex
          ref: 677706df845ee8190e6ba99261c5c53ff036388b
          ssh-key: ${{ secrets.TEMP_LEO_WINDOWS_READ_KEY }}
          persist-credentials: false
      - name: Set up Node 24 without shared cache
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Build exact integrated candidate
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          if ((git rev-parse HEAD).Trim() -ne '677706df845ee8190e6ba99261c5c53ff036388b') { throw 'Wrong lean candidate commit' }
          if (git status --porcelain) { throw 'Integrated candidate checkout is dirty' }
          function Invoke-Checked([string]$Name, [scriptblock]$Command) {
            $log = Join-Path $env:RUNNER_TEMP ("leo-full-" + $Name + '.log')
            & $Command *> $log
            if ($LASTEXITCODE -ne 0) { Get-Content -LiteralPath $log -Tail 80; throw "$Name failed" }
            Write-Host "$Name passed"
          }
          Invoke-Checked 'npm-ci' { npm.cmd ci --strict-allow-scripts }
          Invoke-Checked 'build' { npm.cmd run build }
      - name: Prepare protected disposable Windows TEMP
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          node scripts/prepare-windows-ci-temp.mjs *> (Join-Path $env:RUNNER_TEMP 'leo-full-temp.log')
          if ($LASTEXITCODE -ne 0) { throw 'Protected disposable TEMP preparation failed' }
      - name: Run ACL and rename fixtures in protected TEMP
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          function Invoke-Checked([string]$Name, [scriptblock]$Command) {
            $log = Join-Path $env:RUNNER_TEMP ("leo-full-" + $Name + '.log')
            & $Command *> $log
            if ($LASTEXITCODE -ne 0) { Get-Content -LiteralPath $log -Tail 80; throw "$Name failed" }
            Write-Host "$Name passed"
          }
          Invoke-Checked 'acl-fixture' { node --test tests/private-path-batch.test.mjs }
          Invoke-Checked 'rename-fixture' { node --test tests/windows-fresh-move-smoke.mjs }
          Invoke-Checked 'lean-stage-fixtures' { node --test tests/stage-fresh-payload.test.mjs }
          Invoke-Checked 'lean-install-fixtures' { node --test tests/fresh-install.test.mjs }
      - name: Build exact production source in protected TEMP
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $source = Join-Path $env:LEO_WINDOWS_TEST_TEMP_ROOT 'source'
          function Invoke-Checked([string]$Name, [scriptblock]$Command) {
            $log = Join-Path $env:RUNNER_TEMP ("leo-full-protected-" + $Name + '.log')
            & $Command *> $log
            if ($LASTEXITCODE -ne 0) { Get-Content -LiteralPath $log -Tail 80; throw "$Name failed" }
            Write-Host "$Name passed"
          }
          Invoke-Checked 'clone' { git clone --no-hardlinks $env:GITHUB_WORKSPACE $source }
          Invoke-Checked 'checkout' { git -C $source checkout --detach 677706df845ee8190e6ba99261c5c53ff036388b }
          Set-Location -LiteralPath $source
          Invoke-Checked 'npm-ci' { npm.cmd ci --strict-allow-scripts }
          Invoke-Checked 'build' { npm.cmd run build }
          Invoke-Checked 'production-ci' { npm.cmd ci --omit=dev --strict-allow-scripts }
          Invoke-Checked 'graph' { node scripts/check-published-graph.mjs }
          if ((git rev-parse HEAD).Trim() -ne '677706df845ee8190e6ba99261c5c53ff036388b' -or (git status --porcelain)) { throw 'Protected source identity drifted' }
      - name: Time full native Root stage, seal, and stopped install
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          Set-Location -LiteralPath (Join-Path $env:LEO_WINDOWS_TEST_TEMP_ROOT 'source')
          $revision = '677706df845ee8190e6ba99261c5c53ff036388b'
          $release = Join-Path $env:LEO_WINDOWS_TEST_TEMP_ROOT 'release-root'
          $payload = Join-Path $release 'payload'
          $installParent = Join-Path $env:LEO_WINDOWS_TEST_TEMP_ROOT 'installed-root'
          $root = Join-Path $installParent 'leo-multiplex-v6-fresh'
          $nodeExe = (Get-Command node.exe).Source
          $privateHelper = Join-Path (Get-Location).Path 'dist/apps/host/src/private-state.js'
          $privateDirectoryProgram = "const m = await import((await import('node:url')).pathToFileURL(process.argv[1]).href); await m.privateDirectory(process.argv[2]);"
          function Invoke-Timed([string]$Name, [scriptblock]$Command) {
            $log = Join-Path $env:RUNNER_TEMP ("leo-full-" + $Name + '.log')
            $watch = [Diagnostics.Stopwatch]::StartNew()
            & $Command *> $log
            $code = $LASTEXITCODE
            $watch.Stop()
            if ($code -ne 0) { Get-Content -LiteralPath $log -Tail 80; throw "$Name failed after $($watch.Elapsed.TotalSeconds) seconds" }
            Write-Host ('{0}_SECONDS={1:F1}' -f $Name.ToUpperInvariant(), $watch.Elapsed.TotalSeconds)
            return (Get-Content -LiteralPath $log | Where-Object { $_.Trim() } | Select-Object -Last 1)
          }
          & node --input-type=module --eval $privateDirectoryProgram $privateHelper $release
          if ($LASTEXITCODE -ne 0) { throw 'Private release creation failed' }
          & node --input-type=module --eval $privateDirectoryProgram $privateHelper $installParent
          if ($LASTEXITCODE -ne 0) { throw 'Private install parent creation failed' }
          $stage = (Invoke-Timed 'stage' { node scripts/stage-fresh-payload.mjs --payload $payload }) | ConvertFrom-Json
          if ($stage.outcome -ne 'STAGED_UNSEALED' -or $stage.files -lt 28000) { throw 'Full production payload was not staged' }
          Write-Host "STAGE_FILES=$($stage.files)"
          $seal = (Invoke-Timed 'seal' { node scripts/fresh-install.mjs seal --artifact $payload --revision $revision --roles root --node $nodeExe }) | ConvertFrom-Json
          $manifestPath = Join-Path $payload 'artifact.json'
          $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
          $artifactSha = (Get-FileHash -Algorithm SHA256 -LiteralPath $manifestPath).Hash.ToLowerInvariant()
          if ($seal.artifactSha256 -ne $artifactSha -or $seal.graphSha256 -ne '0742b9a4ff36a663a895dfdddb0ba60d9d81e0a19318096e3a552b9fa6f4599a' -or $manifest.revision -ne $revision) { throw 'Sealed identity mismatch' }
          $config = Join-Path $release 'config.json'
          $plan = Join-Path $release 'install-plan.json'
          $utf8 = New-Object System.Text.UTF8Encoding($false)
          [IO.File]::WriteAllText($config, '{"root":{}}', $utf8)
          [IO.File]::WriteAllText($plan, (ConvertTo-Json -InputObject @{ version = 1; root = $root; config = $config; service = 'task' } -Compress), $utf8)
          $taskName = 'leo-v6-fresh-root'
          if (Get-ScheduledTask -TaskPath '\' -TaskName $taskName -ErrorAction SilentlyContinue) { throw 'Root task already exists on disposable runner' }
          [IO.File]::AppendAllText($env:GITHUB_ENV, "LEO_FULL_TASK_WAS_ABSENT=1`n")
          $install = (Invoke-Timed 'install' { node (Join-Path $payload 'scripts/fresh-install.mjs') install --artifact-sha256 $artifactSha }) | ConvertFrom-Json
          if ($install.outcome -ne 'INSTALLED_STOPPED') { throw 'Full install did not stop at the reviewed receipt' }
          $installedNode = Join-Path $root 'native/node.exe'
          if ((Get-FileHash -Algorithm SHA256 -LiteralPath $installedNode).Hash.ToLowerInvariant() -ne $manifest.nodeSha256) { throw 'Installed Node digest differs' }
          $task = Get-ScheduledTask -TaskPath '\' -TaskName $taskName -ErrorAction Stop
          $expectedArguments = ('"{0}" "run" "--root" "{1}" "--role" "root"' -f (Join-Path $root 'artifact/scripts/fresh-install.mjs'), $root)
          if ($task.State -ne 'Ready' -or @($task.Actions).Count -ne 1 -or $task.Actions[0].Execute -ine $installedNode -or
              $task.Actions[0].Arguments -cne $expectedArguments -or $task.Actions[0].WorkingDirectory -ine $root) { throw 'Installed stock-Node task is not stopped and pinned' }
          Write-Host 'FULL_ROOT_STAGED_SEALED_INSTALLED_STOPPED=PASS'
      - name: Remove only the task registered by this disposable run
        if: always() && steps.checkout.outcome == 'success'
        shell: powershell
        run: |
          if ($env:LEO_FULL_TASK_WAS_ABSENT -ne '1' -or -not $env:LEO_WINDOWS_TEST_TEMP_ROOT) { return }
          $root = Join-Path $env:LEO_WINDOWS_TEST_TEMP_ROOT 'installed-root/leo-multiplex-v6-fresh'
          $installedNode = Join-Path $root 'native/node.exe'
          $task = Get-ScheduledTask -TaskPath '\' -TaskName 'leo-v6-fresh-root' -ErrorAction SilentlyContinue
          if ($task) {
            if (@($task.Actions).Count -ne 1 -or $task.Actions[0].Execute -ine $installedNode) { throw 'Unexpected task identity; refusing cleanup' }
            Unregister-ScheduledTask -TaskPath '\' -TaskName 'leo-v6-fresh-root' -Confirm:$false
          }
          if (Get-ScheduledTask -TaskPath '\' -TaskName 'leo-v6-fresh-root' -ErrorAction SilentlyContinue) { throw 'Disposable task cleanup failed' }
      - name: Remove disposable protected Windows TEMP
        if: always() && steps.checkout.outcome == 'success'
        shell: powershell
        run: |
          if (-not $env:LEO_WINDOWS_TEST_TEMP_ROOT) { return }
          node scripts/prepare-windows-ci-temp.mjs cleanup *> (Join-Path $env:RUNNER_TEMP 'leo-full-cleanup.log')
          if ($LASTEXITCODE -ne 0) { throw 'Protected disposable TEMP cleanup failed' }

  helper_pin:
    if: true
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - name: Check out exact fast bootstrap helper pin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: arduano/leo-multiplex
          ref: ef02c75f928faafa76d0923147b97785b8b984a8
          ssh-key: ${{ secrets.TEMP_LEO_WINDOWS_READ_KEY }}
          persist-credentials: false
      - name: Set up Node 24 without shared cache
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Parse and smoke fast helper under Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD).Trim() -ne 'ef02c75f928faafa76d0923147b97785b8b984a8') { throw 'Wrong lean helper pin' }
          if (git status --porcelain) { throw 'Fast helper checkout is dirty' }
          & .\tests\windows-bootstrap-progress.ps1
          $taskName = 'leo-v6-handover-smoke-' + [Guid]::NewGuid().ToString('N')
          $ownerSid = [Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          function Sid([string]$Name) {
            if ($Name -match '^S-1-') { return $Name }
            return ([Security.Principal.NTAccount]::new($Name)).Translate([Security.Principal.SecurityIdentifier]).Value
          }
          $node = (Get-Command node.exe -ErrorAction Stop).Source
          $action = New-ScheduledTaskAction -Execute $node -Argument '--version'
          $trigger = New-ScheduledTaskTrigger -AtLogOn -User $ownerSid
          $principal = New-ScheduledTaskPrincipal -UserId $ownerSid -LogonType Interactive -RunLevel Limited
          try {
            Register-ScheduledTask -TaskPath '\' -TaskName $taskName -Action $action -Trigger $trigger -Principal $principal -ErrorAction Stop | Out-Null
            $task = Get-ScheduledTask -TaskPath '\' -TaskName $taskName -ErrorAction Stop
            $checks = [ordered]@{
              StateReady = [string]$task.State -eq 'Ready'
              PrincipalOwner = (Sid $task.Principal.UserId) -eq $ownerSid
              Interactive = [string]$task.Principal.LogonType -eq 'Interactive'
              Limited = [string]$task.Principal.RunLevel -eq 'Limited'
              OneTrigger = @($task.Triggers).Count -eq 1
              LogonTrigger = $task.Triggers[0].CimClass.CimClassName -eq 'MSFT_TaskLogonTrigger'
              TriggerOwner = (Sid $task.Triggers[0].UserId) -eq $ownerSid
            }
            Write-Host (ConvertTo-Json -InputObject $checks -Compress)
            if ([string]$task.State -ne 'Ready' -or (Sid $task.Principal.UserId) -ne $ownerSid -or
                [string]$task.Principal.LogonType -ne 'Interactive' -or [string]$task.Principal.RunLevel -ne 'Limited' -or
                @($task.Triggers).Count -ne 1 -or $task.Triggers[0].CimClass.CimClassName -ne 'MSFT_TaskLogonTrigger' -or
                (Sid $task.Triggers[0].UserId) -ne $ownerSid) { throw 'Registered task differs from handover fence' }
            Disable-ScheduledTask -TaskPath '\' -TaskName $taskName -ErrorAction Stop | Out-Null
            if ([string](Get-ScheduledTask -TaskPath '\' -TaskName $taskName -ErrorAction Stop).State -ne 'Disabled') {
              throw 'Disabled task state differs from handover fence'
            }
          } finally {
            $task = Get-ScheduledTask -TaskPath '\' -TaskName $taskName -ErrorAction SilentlyContinue
            if ($task) { Unregister-ScheduledTask -TaskPath '\' -TaskName $taskName -Confirm:$false -ErrorAction Stop }
          }
          Write-Host 'Native Windows lean helper pin, parser, progress, and task handover property smoke passed'
