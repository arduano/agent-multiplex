name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  quality:
    name: Build, test, and package
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: "@arduano"
      - name: Install exact npm and verify toolchain
        shell: bash
        run: |
          expected_node="$(<.node-version)"
          expected_npm="$(jq -r '.packageManager | ltrimstr("npm@")' package.json)"
          npm install --global --ignore-scripts "npm@$expected_npm"
          test "$(node --version)" = "v$expected_node"
          test "$(npm --version)" = "$expected_npm"
      - name: Install locked dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}
        run: npm ci --strict-allow-scripts
      - name: Detect staged transport boundary
        id: transport
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, existsSync, readFileSync } from 'node:fs';
          const path = 'transport-candidate/manifest.json';
          const manifest = existsSync(path) ? JSON.parse(readFileSync(path, 'utf8')) : null;
          if (manifest && (!/^[0-9a-f]{40}$/.test(manifest.upstreamCommit) ||
              typeof manifest.releaseBlocked !== 'boolean')) throw new Error('Invalid transport candidate boundary');
          appendFileSync(process.env.GITHUB_OUTPUT,
            `candidate=${manifest !== null}\nrelease_blocked=${manifest?.releaseBlocked === true}\n` +
            `upstream_commit=${manifest?.upstreamCommit ?? ''}\n`);
          NODE
      - name: Check out exact independent transport source
        if: steps.transport.outputs.candidate == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: arduano/p2prpc
          ref: ${{ steps.transport.outputs.upstream_commit }}
          path: receipts/upstream-p2prpc
          # Private source requires this read-only cross-repository token.
          token: ${{ secrets.P2PRPC_SOURCE_READ_TOKEN || github.token }}
          persist-credentials: false
      - name: Prepare reviewed transport candidate without changing pins
        if: steps.transport.outputs.candidate == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}
        run: npm run prepare:transport-renewal -- receipts/upstream-p2prpc
      - name: Validate GitHub Actions workflows
        run: bash scripts/check-github-actions.sh
      - name: Validate release metadata
        run: npm run check:release
      - name: Validate documentation
        run: npm run check:docs
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Verify native Copilot permission RPCs without model calls
        run: node tests/copilot-permissions-smoke.mjs
      - name: Audit the complete release-build dependency graph
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}
        run: npm audit --audit-level=high
      - name: Build exact package candidates
        if: steps.transport.outputs.release_blocked != 'true'
        run: npm run build && npm run release:pack -- --allow-dirty
      - name: Validate packed consumers
        if: steps.transport.outputs.release_blocked != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}
        run: npm run release:verify
      - name: Generate CycloneDX SBOM
        if: steps.transport.outputs.release_blocked != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}
        run: npm run release:sbom
      - name: Scan tracked source for credentials
        run: npm run check:secrets
      - name: Upload package candidates
        if: steps.transport.outputs.release_blocked != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agent-multiplex-${{ github.sha }}
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 14
